[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migrationguard"
version = "0.3.0"
description = "PostgreSQL migration safety checker"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "psycopg[binary]==3.2.9",
  "sqlparse==0.5.3",
  "pydantic==2.11.7",
]

[project.scripts]
migrationguard = "app.cli:main"

[tool.setuptools]
packages = ["app"]
