name: MigrationGuard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  migrationguard:
    name: MigrationGuard
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: migrationguard
          POSTGRES_PASSWORD: migrationguard
          POSTGRES_DB: migrationguard_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U migrationguard -d migrationguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MigrationGuard
        run: python -m pip install -e .

      # For this demo repository, the application under test lives in
      # sample_project. Change PROJECT_PATH to . when this workflow is copied
      # into a real application repository whose migrations live at its root.
      - name: Run MigrationGuard
        id: scan
        continue-on-error: true
        env:
          MG_DATABASE_URL: postgresql://migrationguard:migrationguard@127.0.0.1:5433/migrationguard_test
          PROJECT_PATH: sample_project
        run: |
          set +e
          migrationguard scan "$PROJECT_PATH" --format json --output migrationguard-report.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload MigrationGuard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrationguard-report
          path: migrationguard-report.json
          if-no-files-found: ignore

      - name: Comment on Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_FILE: migrationguard-report.json
        with:
          script: |
            const fs = require("fs");

            if (!fs.existsSync(process.env.REPORT_FILE)) {
              core.warning("MigrationGuard report was not generated.");
              return;
            }

            const report = JSON.parse(
              fs.readFileSync(process.env.REPORT_FILE, "utf8")
            );

            const icons = {
              PASS: "✅",
              WARNING: "⚠️",
              BLOCK: "❌",
              FAIL: "❌"
            };

            const issueLines = [];
            for (const migration of report.migrations) {
              for (const issue of migration.issues) {
                issueLines.push(
                  `- **${issue.severity}** \`${issue.rule}\` — ${issue.message}`
                );
                for (const ref of (issue.references || [])) {
                  issueLines.push(
                    `  - \`${ref.file}:${ref.line}\` — \`${ref.match}\``
                  );
                }
              }
            }

            const body = [
              `## ${icons[report.status] || "ℹ️"} MigrationGuard`,
              "",
              `**Status:** ${report.status}`,
              `**Database:** ${report.database}`,
              `**Migrations scanned:** ${report.migrations_scanned}`,
              "",
              issueLines.length
                ? `### Issues\n${issueLines.join("\n")}`
                : "### Issues\nNo migration safety issues detected.",
              "",
              "### PostgreSQL test",
              `${icons[report.database_test.status] || "ℹ️"} ${report.database_test.status} — ${report.database_test.message}`,
              "",
              "### Summary",
              `PASS: ${report.summary.pass} · WARNING: ${report.summary.warning} · BLOCK: ${report.summary.block}`,
              "",
              "_Generated by MigrationGuard_"
            ].join("\n");

            const marker = "<!-- migrationguard-report -->";
            const finalBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: context.issue.number,
                per_page: 100
              }
            );

            const existing = comments.find(
              comment => comment.user?.type === "Bot" &&
                          comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: finalBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body: finalBody
              });
            }

      - name: Enforce MigrationGuard result
        if: always() && steps.scan.outputs.exit_code != '0'
        run: |
          echo "MigrationGuard failed the pull request."
          echo "Exit code: ${{ steps.scan.outputs.exit_code }}"
          exit 1
