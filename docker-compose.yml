services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MG_DATABASE_URL: postgresql://migrationguard:migrationguard@postgres:5432/migrationguard_test
      MG_PROJECT_ROOT: /workspace/project
    volumes:
      - ./sample_project:/workspace/project:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: migrationguard
      POSTGRES_PASSWORD: migrationguard
      POSTGRES_DB: migrationguard_test
    ports:
      - "5433:5432"
    volumes:
      - migrationguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrationguard -d migrationguard_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  migrationguard_pgdata:
